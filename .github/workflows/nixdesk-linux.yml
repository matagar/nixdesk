name: NixDesk Linux x64

# Compilación recortada de NixDesk: solo el paquete .deb para x86_64, sin firma,
# sin rpm, appimage ni flatpak, y sin publicar releases.
# Los pasos salen del trabajo `build-rustdesk-linux` de flutter-build.yml
# (mismas versiones fijadas, misma imagen de compilación y mismos parches).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75" # igual que flutter-build.yml
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  # Marca y servidor propio. La clave es la pública del servidor (no es un secreto).
  NIXDESK_APP_NAME: "NixDesk"
  NIXDESK_PACKAGE_NAME: "nixdesk"
  NIXDESK_RENDEZVOUS_SERVER: "nixdesk.matagar.com.ar"
  NIXDESK_RS_PUB_KEY: "8Xn4R7JT5qomD0T+gaTlBWCDxoCU1e2D41UxqUBaYpA="

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-nixdesk-linux:
    needs: [generate-bridge]
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      ARCH: x86_64
      TARGET: x86_64-unknown-linux-gnu
      DISTRO: ubuntu18.04
      DEB_ARCH: amd64
      VCPKG_TRIPLET: x64-linux
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          sudo apt-get install -y qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # El nombre de la aplicación, el servidor de encuentro por defecto y su clave
      # pública son constantes de libs/hbb_common (submódulo de rustdesk/hbb_common).
      # Se cambian acá, sobre la copia descargada, para no mantener otro fork.
      # Si el submódulo cambia y alguna línea ya no coincide, el paso falla.
      - name: Aplicar marca y servidor de NixDesk en hbb_common
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          sed -i -E \
            -e "s|^(\s*pub static ref APP_NAME: RwLock<String> = RwLock::new\(\")RustDesk(\"\.to_owned\(\)\);)|\1${NIXDESK_APP_NAME}\2|" \
            -e "s|^(pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[)\"[^]]*\"(\];)|\1\"${NIXDESK_RENDEZVOUS_SERVER}\"\2|" \
            -e "s|^(pub const RS_PUB_KEY: &str = \")[^\"]*(\";)|\1${NIXDESK_RS_PUB_KEY}\2|" \
            "$f"
          grep -nF "pub static ref APP_NAME: RwLock<String> = RwLock::new(\"${NIXDESK_APP_NAME}\".to_owned());" "$f"
          grep -nF "pub const RENDEZVOUS_SERVERS: &[&str] = &[\"${NIXDESK_RENDEZVOUS_SERVER}\"];" "$f"
          grep -nF "pub const RS_PUB_KEY: &str = \"${NIXDESK_RS_PUB_KEY}\";" "$f"
          git -C libs/hbb_common diff --stat

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          # only build cdylib
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ env.VCPKG_TRIPLET }}-rel-out.log" || true
        shell: bash

      # Sin `githubToken`: la acción compila la imagen en el momento y no la publica
      # como paquete en ghcr.io de la cuenta.
      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build nixdesk
        id: vcpkg
        with:
          arch: ${{ env.ARCH }}
          distro: ${{ env.DISTRO }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            # output devs
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            # rust
            pushd /opt
            # do not use rustup, because memory overflow in qemu
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }} && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }}
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            # Setup Flutter
            export PATH=/opt/flutter/bin:$PATH
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            flutter doctor -v

            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              pushd /opt/flutter
              git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # build flutter
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=${{ env.DEB_ARCH }}
            python3 ./build.py --flutter --skip-cargo
            mv "${{ env.NIXDESK_PACKAGE_NAME }}-${{ env.VERSION }}.deb" "${{ env.NIXDESK_PACKAGE_NAME }}-${{ env.VERSION }}-${{ env.ARCH }}.deb"

      # Control del paquete: nombre, sin conflicto con `rustdesk`, sin rutas compartidas
      # con el paquete oficial, y con el servidor y la clave propios dentro del binario.
      - name: Verificar el paquete
        shell: bash
        run: |
          deb="${NIXDESK_PACKAGE_NAME}-${VERSION}-${ARCH}.deb"
          ls -l "$deb"
          sha256sum "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | awk '{print $1, $6, $7, $8}' > contenido.txt
          grep -v '/data/flutter_assets/' contenido.txt
          test "$(dpkg-deb -f "$deb" Package)" = "${NIXDESK_PACKAGE_NAME}"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${DEB_ARCH}"
          for campo in Conflicts Replaces Provides Breaks; do
            test -z "$(dpkg-deb -f "$deb" "$campo")"
          done
          # La única ruta con "rustdesk" que se admite es la biblioteca interna del paquete.
          if grep -i rustdesk contenido.txt | grep -v "/usr/share/${NIXDESK_PACKAGE_NAME}/lib/librustdesk.so"; then
            echo "El paquete instala rutas con el nombre rustdesk"
            exit 1
          fi
          mkdir -p extraido
          dpkg-deb -x "$deb" extraido
          dpkg-deb -e "$deb" extraido/DEBIAN
          test -x "extraido/usr/share/${NIXDESK_PACKAGE_NAME}/${NIXDESK_PACKAGE_NAME}"
          test -f "extraido/usr/share/${NIXDESK_PACKAGE_NAME}/files/systemd/${NIXDESK_PACKAGE_NAME}.service"
          if grep -n -i rustdesk extraido/DEBIAN/postinst extraido/DEBIAN/postrm extraido/DEBIAN/preinst extraido/DEBIAN/prerm \
            "extraido/usr/share/${NIXDESK_PACKAGE_NAME}/files/systemd/${NIXDESK_PACKAGE_NAME}.service" \
            extraido/usr/share/applications/*.desktop; then
            echo "Los guiones del paquete nombran a rustdesk"
            exit 1
          fi
          so="extraido/usr/share/${NIXDESK_PACKAGE_NAME}/lib/librustdesk.so"
          grep -c -a -F "${NIXDESK_RENDEZVOUS_SERVER}" "$so"
          grep -c -a -F "${NIXDESK_RS_PUB_KEY}" "$so"
          if grep -q -a -F "rs-ny.rustdesk.com" "$so"; then
            echo "El binario conserva el servidor de RustDesk"
            exit 1
          fi
          sudo rm -rf extraido contenido.txt

      - name: Upload deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixdesk-linux-${{ env.ARCH }}-deb
          path: ${{ env.NIXDESK_PACKAGE_NAME }}-${{ env.VERSION }}-${{ env.ARCH }}.deb
          if-no-files-found: error
