name: NixDesk Android arm64

# Compilación recortada de NixDesk: solo el APK para Android arm64-v8a, firmado con
# la clave propia, sin publicar releases ni metadatos de actualización.
# Los pasos salen del trabajo `build-rustdesk-android` de flutter-build.yml
# (mismas versiones fijadas, mismo ejecutor y mismos parches). La diferencia es la
# firma: acá la hace Gradle con `signingConfigs.release` y un `key.properties`
# armado con los secretos, en vez de firmar después con la clave de depuración.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75" # igual que flutter-build.yml
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  # Marca y servidor propio. La clave es la pública del servidor (no es un secreto).
  NIXDESK_APP_NAME: "NixDesk"
  NIXDESK_PACKAGE_NAME: "nixdesk"
  # Identificador de la aplicación en Android. Distinto del de RustDesk
  # (com.carriez.flutter_hbb) para que convivan en el mismo teléfono. Solo cambia
  # el `applicationId`: el `namespace` y el paquete de Kotlin quedan como están.
  # No se cambia entre versiones: Android lo trata como otra aplicación.
  NIXDESK_ANDROID_APP_ID: "ar.com.matagar.nixdesk"
  NIXDESK_RENDEZVOUS_SERVER: "nixdesk.matagar.com.ar"
  NIXDESK_RS_PUB_KEY: "8Xn4R7JT5qomD0T+gaTlBWCDxoCU1e2D41UxqUBaYpA="
  # Servidor de API propio (cuentas, libreta de direcciones), con esquema y sin
  # barra final, por ejemplo "https://api.ejemplo.com". Se toma de la variable
  # NIXDESK_API_SERVER del repositorio (Settings > Secrets and variables >
  # Actions > Variables). Vacío: la aplicación no usa ningún servidor de API
  # (tampoco los de RustDesk) y no muestra el inicio de sesión de cuenta.
  NIXDESK_API_SERVER: ${{ vars.NIXDESK_API_SERVER || '' }}
  # Clave pública con la que el panel firma los permisos de conexión y modo con
  # que el equipo los trata (no, aviso, exigir). Igual que en Windows, Linux y macOS.
  NIXDESK_PERMISO_PUB_KEY: ${{ vars.NIXDESK_PERMISO_PUB_KEY || '' }}
  NIXDESK_PERMISO_MODO: ${{ vars.NIXDESK_PERMISO_MODO || 'aviso' }}

jobs:
  # Antes de gastar tiempo de compilación: los cuatro secretos de firma tienen que
  # estar y el almacén tiene que abrir con ellos. Si falta algo, el flujo corta acá.
  controlar-firma:
    name: Controlar los secretos de firma
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Controlar los secretos y el almacén de firma
        shell: bash
        env:
          NIXDESK_ANDROID_KEYSTORE_B64: ${{ secrets.NIXDESK_ANDROID_KEYSTORE_B64 }}
          NIXDESK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIXDESK_ANDROID_KEYSTORE_PASSWORD }}
          NIXDESK_ANDROID_KEY_ALIAS: ${{ secrets.NIXDESK_ANDROID_KEY_ALIAS }}
          NIXDESK_ANDROID_KEY_PASSWORD: ${{ secrets.NIXDESK_ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/nixdesk-android-firma.sh controlar

  generate-bridge:
    needs: [controlar-firma]
    uses: ./.github/workflows/bridge.yml

  build-nixdesk-android:
    needs: [generate-bridge]
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              android-abi: arm64-v8a,
              apk-arch: arm64,
              flutter-platform: android-arm64,
              ndk-script: ndk_arm64.sh,
              ndk-lib-dir: aarch64-linux-android,
            }
          # Para sumar armv7 (teléfonos de 32 bits), agregar este elemento:
          # - {
          #     arch: armv7,
          #     target: armv7-linux-androideabi,
          #     os: ubuntu-24.04,
          #     reltype: release,
          #     android-abi: armeabi-v7a,
          #     apk-arch: arm,
          #     flutter-platform: android-arm,
          #     ndk-script: ndk_arm.sh,
          #     ndk-lib-dir: arm-linux-androideabi,
          #   }
    env:
      TARGET: ${{ matrix.job.target }}
      RELTYPE: ${{ matrix.job.reltype }}
      ANDROID_ABI: ${{ matrix.job.android-abi }}
      APK_ARCH: ${{ matrix.job.apk-arch }}
      FLUTTER_PLATFORM: ${{ matrix.job.flutter-platform }}
      NDK_SCRIPT: ${{ matrix.job.ndk-script }}
      NDK_LIB_DIR: ${{ matrix.job.ndk-lib-dir }}
      KEY_PROPERTIES: flutter/android/key.properties
    steps:
      # `android: false`: el SDK de Android del ejecutor se conserva (lo usan Gradle
      # y, al final, apksigner y aapt2).
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # El nombre de la aplicación, el servidor de encuentro por defecto y su clave
      # pública son constantes de libs/hbb_common (submódulo de rustdesk/hbb_common).
      # Se cambian acá, sobre la copia descargada, para no mantener otro fork.
      # Si el submódulo cambia y alguna línea ya no coincide, el paso falla.
      - name: Aplicar marca y servidor de NixDesk en hbb_common
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          sed -i -E \
            -e "s|^(\s*pub static ref APP_NAME: RwLock<String> = RwLock::new\(\")RustDesk(\"\.to_owned\(\)\);)|\1${NIXDESK_APP_NAME}\2|" \
            -e "s|^(pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[)\"[^]]*\"(\];)|\1\"${NIXDESK_RENDEZVOUS_SERVER}\"\2|" \
            -e "s|^(pub const RS_PUB_KEY: &str = \")[^\"]*(\";)|\1${NIXDESK_RS_PUB_KEY}\2|" \
            "$f"
          grep -nF "pub static ref APP_NAME: RwLock<String> = RwLock::new(\"${NIXDESK_APP_NAME}\".to_owned());" "$f"
          grep -nF "pub const RENDEZVOUS_SERVERS: &[&str] = &[\"${NIXDESK_RENDEZVOUS_SERVER}\"];" "$f"
          grep -nF "pub const RS_PUB_KEY: &str = \"${NIXDESK_RS_PUB_KEY}\";" "$f"
          git -C libs/hbb_common diff --stat

      # El servidor de API es una constante de src/nixdesk.rs. Vacío es un valor
      # válido (sin servidor de API). Si la línea ya no coincide, el paso falla.
      - name: Aplicar el servidor de API de NixDesk
        shell: bash
        run: |
          f=src/nixdesk.rs
          api="${NIXDESK_API_SERVER%/}"
          case "$api" in
            ""|http://*|https://*) ;;
            *) echo "NIXDESK_API_SERVER tiene que empezar con http:// o https://"; exit 1 ;;
          esac
          case "$api" in
            *'"'*|*'|'*|*'\'*|*'&'*|*' '*) echo "NIXDESK_API_SERVER tiene caracteres no admitidos"; exit 1 ;;
          esac
          case "$api" in
            *rustdesk.com*) echo "NIXDESK_API_SERVER no puede ser un servidor de RustDesk"; exit 1 ;;
          esac
          sed -i -E "s|^(pub const API_SERVER: &str = \")[^\"]*(\";)|\1${api}\2|" "$f"
          grep -nF "pub const API_SERVER: &str = \"${api}\";" "$f"
          if [ -z "$api" ]; then echo "Sin servidor de API"; else echo "Servidor de API: $api"; fi

      # Clave pública y modo del permiso de conexión: constantes de src/nixdesk.rs.
      # El guion valida los valores (modo dentro de los tres, clave en base64 de
      # 32 bytes) y controla que el campo nixdesk_permiso esté en el LoginRequest.
      - name: Aplicar el permiso de conexión de NixDesk
        shell: bash
        run: bash .github/scripts/nixdesk-aplicar-permiso.sh

      # Marca en el proyecto de Android (no está en el código del fork: se aplica acá).
      # - applicationId propio, para convivir con RustDesk. El namespace, el atributo
      #   `package` del manifiesto y el paquete de Kotlin no se tocan: las clases
      #   (.MainActivity, .MainService...) se resuelven contra el namespace, y nada
      #   del código busca el identificador viejo en tiempo de ejecución.
      # - Nombre visible, textos y esquema de enlaces. El esquema tiene que ser el
      #   nombre de la aplicación en minúsculas: es lo que arma get_uri_prefix()
      #   (src/common.rs) y lo que abren los enlaces del panel.
      # Cada cambio se controla después: si un texto buscado ya no está, el paso falla.
      - name: Aplicar la marca de NixDesk en flutter/android
        shell: bash
        run: |
          gradle=flutter/android/app/build.gradle
          manifiesto=flutter/android/app/src/main/AndroidManifest.xml
          textos=flutter/android/app/src/main/res/values/strings.xml
          kotlin=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb

          test "$(printf '%s' "${NIXDESK_APP_NAME}" | tr '[:upper:]' '[:lower:]')" = "${NIXDESK_PACKAGE_NAME}"
          printf '%s' "${NIXDESK_ANDROID_APP_ID}" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          test "${NIXDESK_ANDROID_APP_ID}" != "com.carriez.flutter_hbb"

          # applicationId (una sola línea en defaultConfig).
          test "$(grep -cE '^\s*applicationId\s' "$gradle")" = "1"
          sed -i -E "s|^(\s*applicationId )\"com\.carriez\.flutter_hbb\"\s*$|\1\"${NIXDESK_ANDROID_APP_ID}\"|" "$gradle"
          grep -nxF "        applicationId \"${NIXDESK_ANDROID_APP_ID}\"" "$gradle"
          grep -nxF '    namespace "com.carriez.flutter_hbb"' "$gradle"
          grep -nF 'package="com.carriez.flutter_hbb"' "$manifiesto"

          # Nada del proyecto de Android puede depender del identificador viejo fuera
          # de lo ya revisado: namespace, package, paquete de Kotlin y la acción de
          # prueba de BootReceiver (es el nombre de un intent, igual en el manifiesto
          # y en el código). Si aparece otro uso, hay que mirarlo antes de compilar.
          if grep -rnI 'com\.carriez' flutter/android flutter/lib \
              --include='*.xml' --include='*.gradle' --include='*.kt' --include='*.java' \
              --include='*.json' --include='*.properties' --include='*.dart' \
            | grep -vE '^flutter/android/app/build\.gradle:[0-9]+:\s*namespace "com\.carriez\.flutter_hbb"$' \
            | grep -vE '^flutter/android/app/src/(main|debug|profile)/AndroidManifest\.xml:[0-9]+:\s*package="com\.carriez\.flutter_hbb">$' \
            | grep -vE '^flutter/android/app/src/main/kotlin/[^:]+\.kt:[0-9]+:(package|import) com\.carriez\.flutter_hbb(\.[A-Za-z0-9_.*]+)?\s*$' \
            | grep -vF 'com.carriez.flutter_hbb.DEBUG_BOOT_COMPLETED'; then
            echo "::error::Hay usos de com.carriez que no están revisados para el cambio de applicationId"
            exit 1
          fi
          # Sin proveedores con autoridad fija ni servicios de Google atados al identificador.
          if grep -n 'android:authorities' "$manifiesto"; then
            echo "::error::El manifiesto declara un proveedor: revisar que use \${applicationId}"
            exit 1
          fi
          test ! -e flutter/android/app/google-services.json

          # Nombre visible y esquema de enlaces en el manifiesto.
          sed -i \
            -e "s|android:label=\"RustDesk\"|android:label=\"${NIXDESK_APP_NAME}\"|" \
            -e "s|android:label=\"RustDesk Input\"|android:label=\"${NIXDESK_APP_NAME} Input\"|" \
            -e "s|<data android:scheme=\"rustdesk\" />|<data android:scheme=\"${NIXDESK_PACKAGE_NAME}\" />|" \
            "$manifiesto"
          grep -nF "android:label=\"${NIXDESK_APP_NAME}\"" "$manifiesto"
          grep -nF "android:label=\"${NIXDESK_APP_NAME} Input\"" "$manifiesto"
          grep -nF "<data android:scheme=\"${NIXDESK_PACKAGE_NAME}\" />" "$manifiesto"
          test "$(grep -c 'android:scheme=' "$manifiesto")" = "1"
          if grep -n -i 'rustdesk' "$manifiesto"; then
            echo "::error::El manifiesto todavía nombra a RustDesk"
            exit 1
          fi

          # Textos de recursos (nombre y descripciones de los servicios).
          sed -i "s|RustDesk|${NIXDESK_APP_NAME}|g" "$textos"
          grep -nF "<string name=\"app_name\">${NIXDESK_APP_NAME}</string>" "$textos"
          if grep -n -i 'rustdesk' "$textos"; then
            echo "::error::strings.xml todavía nombra a RustDesk"
            exit 1
          fi

          # Textos fijos que ve la persona: título de la notificación, nombre del
          # canal de notificaciones y aviso al arrancar. El identificador interno
          # del canal ("RustDesk") y el nombre de la biblioteca no se tocan.
          sed -i \
            -e "s|^const val DEFAULT_NOTIFY_TITLE = \"RustDesk\"$|const val DEFAULT_NOTIFY_TITLE = \"${NIXDESK_APP_NAME}\"|" \
            -e "s|val channelName = \"RustDesk Service\"|val channelName = \"${NIXDESK_APP_NAME} Service\"|" \
            -e "s|description = \"RustDesk Service Channel\"|description = \"${NIXDESK_APP_NAME} Service Channel\"|" \
            "$kotlin/MainService.kt"
          grep -nxF "const val DEFAULT_NOTIFY_TITLE = \"${NIXDESK_APP_NAME}\"" "$kotlin/MainService.kt"
          grep -nF "val channelName = \"${NIXDESK_APP_NAME} Service\"" "$kotlin/MainService.kt"
          grep -nF "description = \"${NIXDESK_APP_NAME} Service Channel\"" "$kotlin/MainService.kt"
          sed -i "s|\"RustDesk is Open\"|\"${NIXDESK_APP_NAME} is Open\"|" "$kotlin/BootReceiver.kt"
          grep -nF "\"${NIXDESK_APP_NAME} is Open\"" "$kotlin/BootReceiver.kt"

          # La firma de release sale de key.properties: build.gradle tiene que seguir
          # leyéndolo y usándolo (más abajo NO se cambia a la firma de depuración).
          grep -nF "rootProject.file('key.properties')" "$gradle"
          grep -nF "storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null" "$gradle"
          grep -nF "keyAlias keystoreProperties['keyAlias']" "$gradle"
          grep -nF "keyPassword keystoreProperties['keyPassword']" "$gradle"
          grep -nF "storePassword keystoreProperties['storePassword']" "$gradle"
          test "$(grep -cE '^\s*signingConfig signingConfigs\.release\s*$' "$gradle")" = "1"
          if grep -n 'signingConfigs\.debug' "$gradle"; then
            echo "::error::build.gradle usa la firma de depuración"
            exit 1
          fi

          git diff --stat -- flutter/android

      - name: Check JNI natives are in ffi.FFI
        # Custom clients rename com.carriez.flutter_hbb; only ffi.FFI keeps its name.
        shell: bash
        run: |
          bad=0
          grep -rnE --include='*.rs' 'fn Java_' src libs | grep -v 'fn Java_ffi_FFI_' && bad=1
          grep -rl --include='*.kt' 'external fun' flutter/android \
            | grep -vx 'flutter/android/app/src/main/kotlin/ffi.kt' && bad=1
          grep -rn --include='*.rs' 'com/carriez' src libs && bad=1
          if [ "$bad" = 1 ]; then
            echo "::error::Declare Android natives in ffi.FFI, export them as Java_ffi_FFI_*, and do not look up app classes by name (see AGENTS.md)"
            exit 1
          fi

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! ./flutter/build_android_deps.sh "${ANDROID_ABI}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      # Antes de la compilación larga: las pruebas de la verificación del permiso,
      # en un crate mínimo con las mismas versiones del Cargo.lock.
      - name: Probar la verificación del permiso de conexión
        shell: bash
        run: bash .github/scripts/nixdesk-probar-permiso.sh

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: nixdesk-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add "${TARGET}"
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          test -f "./flutter/${NDK_SCRIPT}"
          bash "./flutter/${NDK_SCRIPT}"
          mkdir -p "./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}"
          cp "./target/${TARGET}/release/liblibrustdesk.so" "./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}/librustdesk.so"

      # Recién acá entran los secretos: se arma el almacén en la carpeta temporal
      # del ejecutor y el key.properties que lee build.gradle. El guion no imprime
      # nada de eso; deja la huella del certificado en NIXDESK_ANDROID_CERT_SHA256.
      - name: Preparar la firma
        shell: bash
        env:
          NIXDESK_ANDROID_KEYSTORE_B64: ${{ secrets.NIXDESK_ANDROID_KEYSTORE_B64 }}
          NIXDESK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIXDESK_ANDROID_KEYSTORE_PASSWORD }}
          NIXDESK_ANDROID_KEY_ALIAS: ${{ secrets.NIXDESK_ANDROID_KEY_ALIAS }}
          NIXDESK_ANDROID_KEY_PASSWORD: ${{ secrets.NIXDESK_ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/nixdesk-android-firma.sh preparar "${KEY_PROPERTIES}"

      - name: Build nixdesk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Firma de release con la clave propia: key.properties tiene que estar.
          test -s "${KEY_PROPERTIES}"
          mkdir -p "./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}"
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${NDK_LIB_DIR}/libc++_shared.so" "./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}/"
          cp "./target/${TARGET}/release/liblibrustdesk.so" "./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}/librustdesk.so"
          # build flutter
          pushd flutter
          flutter build apk "--${RELTYPE}" --target-platform "${FLUTTER_PLATFORM}" --split-per-abi
          popd
          apk="${NIXDESK_PACKAGE_NAME}-${VERSION}-android-${APK_ARCH}.apk"
          mv "flutter/build/app/outputs/flutter-apk/app-${ANDROID_ABI}-${RELTYPE}.apk" "$apk"
          ls -l "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      # El almacén y el key.properties se borran siempre, haya salido bien o mal.
      - name: Borrar el material de firma
        if: always()
        shell: bash
        run: bash .github/scripts/nixdesk-android-firma.sh limpiar "${KEY_PROPERTIES}"

      # apksigner: el APK tiene que estar firmado, por un solo firmante, con el
      # certificado del almacén (no el de depuración). La huella va al resumen.
      - name: Verificar la firma
        shell: bash
        run: bash .github/scripts/nixdesk-android-firma.sh verificar "${APK}"

      # Control del paquete: identificador, nombre, versión, esquema de enlaces,
      # arquitectura, y el servidor y las claves propios dentro de la biblioteca.
      - name: Verificar el APK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -n 1)"
          echo "build-tools: $bt"
          "${bt}aapt2" dump badging "$APK" > badging.txt
          grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" badging.txt
          grep -F "package: name='${NIXDESK_ANDROID_APP_ID}' " badging.txt
          grep -F "versionName='${VERSION}'" badging.txt
          grep -F "application-label:'${NIXDESK_APP_NAME}'" badging.txt
          "${bt}aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifiesto.txt
          grep -E "scheme.*\"${NIXDESK_PACKAGE_NAME}\"" manifiesto.txt
          if grep -E 'scheme.*"rustdesk"' manifiesto.txt; then
            echo "El APK conserva el esquema rustdesk://"
            exit 1
          fi
          # Bibliotecas: solo la arquitectura pedida.
          unzip -Z1 "$APK" > contenido.txt
          grep -E '^lib/' contenido.txt
          grep -xF "lib/${ANDROID_ABI}/librustdesk.so" contenido.txt
          grep -xF "lib/${ANDROID_ABI}/libc++_shared.so" contenido.txt
          grep -xF "lib/${ANDROID_ABI}/libapp.so" contenido.txt
          grep -xF "lib/${ANDROID_ABI}/libflutter.so" contenido.txt
          if grep -E '^lib/' contenido.txt | grep -vE "^lib/${ANDROID_ABI}/"; then
            echo "El APK trae bibliotecas de otra arquitectura"
            exit 1
          fi
          so=librustdesk-del-apk.so
          unzip -p "$APK" "lib/${ANDROID_ABI}/librustdesk.so" > "$so"
          ls -l "$so"
          grep -c -a -F "${NIXDESK_RENDEZVOUS_SERVER}" "$so"
          grep -c -a -F "${NIXDESK_RS_PUB_KEY}" "$so"
          if grep -q -a -F "rs-ny.rustdesk.com" "$so"; then
            echo "La biblioteca conserva el servidor de RustDesk"
            exit 1
          fi
          if grep -q -a -F "admin.rustdesk.com" "$so"; then
            echo "La biblioteca conserva el servidor de API de RustDesk"
            exit 1
          fi
          if [ -n "${NIXDESK_API_SERVER}" ]; then
            grep -c -a -F "${NIXDESK_API_SERVER%/}" "$so"
          fi
          # La clave con que se verifican los permisos de conexión.
          if [ -n "${NIXDESK_PERMISO_PUB_KEY}" ]; then
            grep -c -a -F "${NIXDESK_PERMISO_PUB_KEY}" "$so"
          fi
          rm -f "$so" badging.txt manifiesto.txt contenido.txt

          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "### APK"
            echo ""
            echo "- Archivo: \`$APK\` ($(stat -c %s "$APK") bytes)"
            echo "- Identificador: \`${NIXDESK_ANDROID_APP_ID}\`"
            echo "- SHA-256 del archivo: \`$(awk '{print $1}' "$APK.sha256")\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Se sube aunque falle un control de más arriba (el job queda igual en rojo): así
      # se puede mirar el APK sin esperar otra compilación entera. Un APK de una
      # corrida en rojo no se instala sin revisar por qué falló.
      - name: Upload apk
        if: ${{ !cancelled() && env.APK != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixdesk-android-${{ matrix.job.apk-arch }}-apk
          path: |
            ${{ env.NIXDESK_PACKAGE_NAME }}-${{ env.VERSION }}-android-${{ matrix.job.apk-arch }}.apk
            ${{ env.NIXDESK_PACKAGE_NAME }}-${{ env.VERSION }}-android-${{ matrix.job.apk-arch }}.apk.sha256
          if-no-files-found: warn
